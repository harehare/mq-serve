name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: package.json
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
